[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outage-schedule-bot"
version = "0.1.0"
description = "Mykolaiv electricity schedule Telegram reminders"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.15,<4", "httpx>=0.27,<1"]

[project.scripts]
outage-bot = "outage_bot.app:main"

[tool.setuptools.packages.find]
include = ["outage_bot*"]
